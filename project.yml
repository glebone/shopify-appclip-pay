name: PayClipDemo
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
packages:
  CheckoutSheetKit:
    url: https://github.com/Shopify/checkout-sheet-kit-swift
    from: 3.9.2
  PayLinkCore:
    path: Packages/PayLinkCore
settings:
  base:
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PayDemo:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: PayClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pay Demo
    entitlements:
      path: App/PayDemo.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:$(CLIP_DOMAIN)?mode=developer
    scheme:
      testTargets: []
  PayClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources: [Clip]
    dependencies:
      - package: CheckoutSheetKit
        product: ShopifyCheckoutSheetKit
      - package: PayLinkCore
        product: PayLinkCore
    info:
      path: Clip/Info.plist
      properties:
        CFBundleDisplayName: Pay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
        STOREFRONT_DOMAIN: $(STOREFRONT_DOMAIN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Clip
    entitlements:
      path: Clip/PayClip.entitlements
      properties:
        com.apple.developer.associated-domains:
          - appclips:$(CLIP_DOMAIN)?mode=developer
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)$(APP_BUNDLE_ID)
    scheme:
      testTargets: []
      environmentVariables:
        _XCAppClipURL: https://$(CLIP_DOMAIN)/pay/?v=$(DEMO_VARIANT_ID)
